<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuickLink Copier</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <button type="button" id="menu-btn" class="hamburger-btn" aria-label="Menu"></button>
      <div class="title"><img src="logo.png" alt="Logo" class="logo" /><h1>QuickLink Copier</h1></div>
      <button type="button" id="close-btn" class="close-btn" aria-label="Close"></button>
    </header>

    <!-- Menu Widget -->
    <div id="menu-widget" class="menu-widget hidden">
      <div class="menu-content">
        <div class="menu-header">
          <h2 data-i18n="menu">Menu</h2>
          <button type="button" id="menu-close" class="menu-close-btn" aria-label="Close menu">×</button>
        </div>
        <div class="menu-items">
          <button type="button" class="menu-item" data-section="settings">
            <span class="menu-icon">⚙</span>
            <span data-i18n="settings">Settings</span>
          </button>
          <button type="button" class="menu-item" data-section="language">
            <span class="menu-icon">🌐</span>
            <span data-i18n="language">Language</span>
          </button>
          <button type="button" class="menu-item" data-section="about">
            <span class="menu-icon">ℹ</span>
            <span data-i18n="about">About</span>
          </button>
        </div>
        

        <!-- Settings Panel -->
        <div id="settings-panel" class="menu-panel hidden">
          <div class="menu-panel-header">
            <button type="button" class="back-btn" data-back="menu" aria-label="Back"></button>
            <h3 data-i18n="settings">Settings</h3>
          </div>
          <div class="menu-panel-content">
            <fieldset class="settings-section">
              <legend data-i18n="preferences">Preferences</legend>
              <label class="checkbox">
                <input id="show-notifications" type="checkbox" checked />
                <span data-i18n="show-notifications">Show notifications</span>
              </label>
              <label class="checkbox">
                <input id="auto-tags" type="checkbox" checked />
                <span data-i18n="auto-tags">Auto-generate tags</span>
              </label>
            </fieldset>
            
            <fieldset class="settings-section">
              <legend data-i18n="history">History</legend>
            <label>
              <span data-i18n="max-history-size">Max history size</span>
              <input id="max-history" type="number" min="5" max="1000" value="5" disabled />
            </label>
            </fieldset>
          </div>
        </div>

        <!-- Language Panel -->
        <div id="language-panel" class="menu-panel hidden">
          <div class="menu-panel-header">
            <button type="button" class="back-btn" data-back="menu" aria-label="Back"></button>
            <h3 data-i18n="language">Language</h3>
          </div>
          <div class="menu-panel-content">
            <fieldset class="language-section">
              <legend data-i18n="select-language">Select Language</legend>
              <label>
                <select id="language-select">
                  <option value="en" selected>English</option>
                  <option value="es">Español</option>
                  <option value="ru">Русский</option>
                </select>
              </label>
            </fieldset>
          </div>
        </div>


        <!-- About Panel -->
        <div id="about-panel" class="menu-panel hidden">
          <div class="menu-panel-header">
            <button type="button" class="back-btn" data-back="menu" aria-label="Back"></button>
            <h3 data-i18n="about">About</h3>
          </div>
          <div class="menu-panel-content">
            <div class="about-content">
              <div class="about-title">
                <img src="logo.png" alt="Logo" class="logo" />
                <h4>QuickLink Copier</h4>
              </div>
              <p>Version 1.0.0</p>
              <p>Developed by Olé</p>
              <p>One-click link copying with history and export features.</p>
              
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Menu Overlay -->
    <div id="menu-overlay" class="menu-overlay hidden"></div>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Copy Current URL Section -->
      <section class="copy-section">
        <h3 class="section-title" data-i18n="current-page">Current Page</h3>
        <div id="current-page-info" class="page-info">
          <!-- Current page info will be populated by JavaScript -->
        </div>
        <div class="copy-actions">
          <button type="button" id="copy-current-url" class="copy-btn primary">
            <span class="btn-text" data-i18n="copy-current-url">Copy Current URL</span>
          </button>
          <button type="button" id="clear-history-main" class="clear-btn secondary">
            <span class="btn-text" data-i18n="clear-history">Clear History</span>
          </button>
        </div>
      </section>

      <!-- Stats Section -->
      <section class="stats-section">
        <div class="stats-grid">
          <div class="stat-item">
            <span class="stat-number" id="total-copied">0</span>
            <span class="stat-label" data-i18n="total-copied">Total Copied</span>
          </div>
          <div class="stat-item">
            <span class="stat-number" id="daily-copied">0</span>
            <span class="stat-label" data-i18n="today">Today</span>
          </div>
        </div>
      </section>

      <!-- Recent Links Section -->
      <section class="recent-section">
        <div class="section-header">
          <h3 data-i18n="recent-links">Recent Links</h3>
        </div>
        <div id="recent-links" class="recent-links">
          <!-- Recent links will be populated by JavaScript -->
        </div>
      </section>

    </main>

    <footer class="footer">
      <span data-i18n="developed-by">Developed by</span>
      <img src="logo.png" alt="Logo" class="logo" />
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
