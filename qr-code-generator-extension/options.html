<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="page-title">Settings — QR Code Generator</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main class="wrap">
    <h1 data-i18n="heading">Default Settings</h1>
    <form id="defaults-form">
      <label>
        <span data-i18n="size">Size (px)</span>
        <input id="d-size" type="number" min="120" max="1024" step="4" />
      </label>
      <label>
        <span data-i18n="module-color">Module Color</span>
        <input id="d-dark" type="color" />
      </label>
      <label>
        <span data-i18n="background-color">Background Color</span>
        <input id="d-light" type="color" />
      </label>
      <label>
        <span data-i18n="error">Error Correction</span>
        <select id="d-ec">
          <option value="L">L (7%)</option>
          <option value="M">M (15%)</option>
          <option value="Q">Q (25%)</option>
          <option value="H">H (30%)</option>
        </select>
      </label>
      <div class="actions">
        <button type="submit" data-i18n="save">Save</button>
        <button type="button" id="reset" data-i18n="reset">Reset</button>
      </div>
    </form>
    <p class="muted" data-i18n="note">Settings are stored locally and applied in the popup.</p>
  </main>
  <script src="options.js"></script>
</body>
</html>
